<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- 状态栏/工具栏着色跟随系统深浅色(与 tokens.css 的 --bg1 对应) -->
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e0b14" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f4f7" />
    <!-- iOS 主屏「添加到主屏幕」后以独立 app 形态运行:全屏、透明黑状态栏 -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="よる" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="description" content="ASMRoner · よる夜间电台" />
    <title>ASMRoner · よる夜间电台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Zen+Old+Mincho:wght@600;900&display=swap" rel="stylesheet" />
    <script>
      // 防 FOUC:首帧前从 localStorage["yoru:settings"] 恢复主题/palette/贴纸
      (function () {
        var d = document.documentElement;
        var theme = "dark", palette = "lavender", stickers = true;
        try {
          var raw = localStorage.getItem("yoru:settings");
          var s = raw ? JSON.parse(raw) : {};
          if (s && typeof s === "object") {
            if (s.theme === "dark" || s.theme === "light") theme = s.theme;
            else if (s.theme === "system")
              theme = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
            if (["lavender", "blue", "orange", "green"].indexOf(s.palette) >= 0) palette = s.palette;
            if (s.stickers === false) stickers = false;
          }
        } catch (e) { /* 读不到时用默认 dark/lavender/stickers=true */ }
        d.dataset.theme = theme;
        d.dataset.palette = palette;
        d.dataset.stickers = String(stickers);
      })();
      // 防 FOUC:桌面壳(Wails)URL 带 ?desktop=1 → 首帧前切桌面模式,
      // 根背景变半透明让窗口玻璃透出;逻辑与 src/lib/platform.ts 保持一致
      (function () {
        var d = document.documentElement;
        var platform = "web";
        try {
          var flag = new URLSearchParams(window.location.search).get("desktop");
          if (flag === "1") platform = "desktop";
          else if (flag === "0") platform = "web";
          else {
            var saved = localStorage.getItem("yoru:platform");
            if (saved === "desktop") platform = "desktop";
          }
          localStorage.setItem("yoru:platform", platform);
        } catch (e) { /* 读不到时用默认 web */ }
        d.dataset.platform = platform;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
