<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ASMRoner Sonic Mission Control</title>
  <desc id="desc">A retro-futuristic command console banner for ASMRoner.</desc>
  <defs>
    <linearGradient id="chassis" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07120d"/>
      <stop offset="0.52" stop-color="#101511"/>
      <stop offset="1" stop-color="#190b13"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#0b1710"/>
      <stop offset="0.55" stop-color="#07110c"/>
      <stop offset="1" stop-color="#040705"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" stroke="#7cffb2" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 0H4" stroke="#d9ffe4" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <filter id="greenGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="pinkGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="360" rx="10" fill="url(#chassis)"/>
  <rect x="18" y="18" width="1244" height="324" rx="6" fill="#121713" stroke="#2a3029" stroke-width="2"/>
  <rect x="34" y="34" width="1212" height="292" rx="3" fill="url(#screen)" stroke="#314238"/>
  <rect x="34" y="34" width="1212" height="292" fill="url(#grid)"/>
  <rect x="34" y="34" width="1212" height="292" fill="url(#scanlines)"/>

  <rect x="58" y="58" width="200" height="32" rx="2" fill="#160a11" stroke="#ff3d7f" stroke-opacity="0.75"/>
  <text x="74" y="79" fill="#ff3d7f" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="3" filter="url(#pinkGlow)">ASMRONER</text>
  <rect x="1058" y="58" width="146" height="32" rx="2" fill="#0d1a12" stroke="#7cffb2" stroke-opacity="0.9"/>
  <text x="1075" y="79" fill="#d9ffe4" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="3" filter="url(#greenGlow)">CRT ONLINE</text>

  <text x="58" y="151" fill="#d9ffe4" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-size="70" letter-spacing="2" filter="url(#greenGlow)">SONIC MISSION</text>
  <text x="58" y="221" fill="#d9ffe4" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-size="70" letter-spacing="2" filter="url(#greenGlow)">CONTROL</text>

  <text x="62" y="265" fill="#a9c9b1" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="17" letter-spacing="1.5">LOCAL HTTP SERVICE / REACT CONTROL DECK / SQLITE TASK STORE / SSE SIGNAL BUS</text>

  <g font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700">
    <rect x="64" y="292" width="132" height="28" rx="2" fill="#0d1a12" stroke="#7cffb2" stroke-opacity="0.65"/>
    <text x="78" y="311" fill="#7cffb2">CORE: ONLINE</text>
    <rect x="214" y="292" width="132" height="28" rx="2" fill="#0d1a12" stroke="#7cffb2" stroke-opacity="0.65"/>
    <text x="228" y="311" fill="#7cffb2">MODE: LOCAL</text>
    <rect x="364" y="292" width="120" height="28" rx="2" fill="#170f07" stroke="#f2a93b" stroke-opacity="0.8"/>
    <text x="378" y="311" fill="#f2a93b">DECK: READY</text>
  </g>

  <g transform="translate(744 106)">
    <rect x="0" y="0" width="430" height="170" rx="4" fill="#0b0f0c" stroke="#2a3029"/>
    <rect x="18" y="18" width="394" height="134" rx="2" fill="#07120d" stroke="#25342b"/>
    <rect x="18" y="18" width="394" height="134" fill="url(#grid)"/>
    <g font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="2">
      <rect x="36" y="36" width="152" height="24" rx="1" fill="#160a11" stroke="#ff3d7f" stroke-opacity="0.65"/>
      <text x="49" y="53" fill="#ff3d7f">ACTIVE MODULES</text>
      <text x="38" y="91" fill="#d9ffe4">DISCOVER</text>
      <rect x="134" y="81" width="240" height="9" fill="#13241a" stroke="#314238"/>
      <rect x="134" y="81" width="205" height="9" fill="#7cffb2" fill-opacity="0.75"/>
      <text x="38" y="119" fill="#d9ffe4">QUEUE</text>
      <rect x="134" y="109" width="240" height="9" fill="#13241a" stroke="#314238"/>
      <rect x="134" y="109" width="156" height="9" fill="#f2a93b" fill-opacity="0.8"/>
      <text x="38" y="147" fill="#d9ffe4">LIBRARY</text>
      <rect x="134" y="137" width="240" height="9" fill="#13241a" stroke="#314238"/>
      <rect x="134" y="137" width="188" height="9" fill="#5dd3f3" fill-opacity="0.75"/>
    </g>
  </g>
</svg>
